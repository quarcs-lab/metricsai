$if(visual-summary)$
<!-- Title slide = the chapter visual summary, full-bleed, nothing else. The image is
     painted as the slide background (data-background-image) so it fills the entire slide;
     `size=contain` shows the WHOLE summary with no cropping (the summaries are 16:9, matching
     the 1280×720 canvas, so it fills edge-to-edge). No title/subtitle/byline text is rendered. -->
<section id="$idprefix$title-slide" class="quarto-title-block title-visual-summary" data-background-image="$visual-summary$" data-background-size="contain" data-background-color="#0f1117"$for(title-slide-attributes/pairs)$ $it.key$="$it.value$"$endfor$>
</section>
$else$
<section id="$idprefix$title-slide" class="quarto-title-block"$for(title-slide-attributes/pairs)$ $it.key$="$it.value$"$endfor$>
  <h1 class="title">$title$</h1>
$if(subtitle)$
  <p class="subtitle">$subtitle$</p>
$endif$
$if(deck-author)$
  <p class="author">$if(deck-author-url)$<a href="$deck-author-url$">$deck-author$</a>$else$$deck-author$$endif$</p>
$endif$
$for(institute)$
  <p class="institute">$institute$</p>
$endfor$
$if(date)$
  <p class="date">$date$</p>
$endif$
</section>
$endif$
